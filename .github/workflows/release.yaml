name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    name: Attach zip to release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python3 -c "import json;print(json.load(open('custom_components/weather_mode/manifest.json'))['version'])")
          if [ "$TAG" != "$VER" ]; then echo "Tag $TAG does not match manifest version $VER"; exit 1; fi
          grep -q "const VERSION = \"$VER\"" custom_components/weather_mode/frontend/weather-mode.js || { echo "weather-mode.js VERSION does not match $VER"; exit 1; }
      - name: Zip integration
        run: cd custom_components/weather_mode && zip -r ../../weather_mode.zip . -x '__pycache__/*'
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" weather_mode.zip --clobber
